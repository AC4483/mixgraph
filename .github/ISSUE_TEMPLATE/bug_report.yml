name: Bug report
description: Something in Mixgraph doesn't work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to the Sets tab
        2. Tap "Build a set"
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / MacBook, Chrome 130
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
