<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mixgraph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky deck header with tabs; one working column; graph is a Camelot-wheel canvas */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --ink:#141826; --muted:#5b6275; --line:#dde0e9;
  --accent:#3647d6; --accent-ink:#ffffff; --accent-soft:#e6e9fd; --star:#e0a100; --danger:#c8323a; --ok:#1d8a55;
  --ok-soft:#dcf2e6; --warn-soft:#fbf0d2;
  --edge:#9aa1b8; --ring:#e3e6ef;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1017; --surface:#171a24; --ink:#e8eaf2; --muted:#959cb0; --line:#2a2e3d;
  --accent:#8e9cff; --accent-ink:#0e1017; --accent-soft:#232a52; --star:#f2c14e; --danger:#ff6b72; --ok:#4cc98a;
  --ok-soft:#173a29; --warn-soft:#3a3115;
  --edge:#565d75; --ring:#1d212e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --ink:#e8eaf2; --muted:#959cb0; --line:#2a2e3d;
  --accent:#8e9cff; --accent-ink:#0e1017; --accent-soft:#232a52; --star:#f2c14e; --danger:#ff6b72; --ok:#4cc98a;
  --ok-soft:#173a29; --warn-soft:#3a3115;
  --edge:#565d75; --ring:#1d212e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 150deg,hsl(150 65% 50%),hsl(240 65% 60%),hsl(330 65% 55%),hsl(60 75% 50%),hsl(150 65% 50%));display:block}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;order:3;width:100%}
.tabs button{flex:1;border:0;background:none;padding:7px 4px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
@media (min-width:760px){.tabs{order:0;width:auto}.tabs button{flex:none;padding:7px 14px}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.icon{padding:4px 7px;font-size:13px;min-width:30px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.good{color:var(--ok);border-color:var(--ok)}
.btn.bad{color:var(--danger)}

main{padding-block:18px 60px}
h2{font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2:first-child{margin-top:4px}
h2 .count{font-family:var(--f-mono);letter-spacing:0;color:var(--muted);font-weight:500}
h2 .sp{margin-left:auto}
.lead{color:var(--muted);margin:-4px 0 12px;font-size:14px;max-width:62ch}
.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}

.chip{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 7px;border-radius:6px;font:700 13px var(--f-mono);color:#fff;flex:none}
.chip.sm{min-width:32px;height:20px;font-size:11px;padding:0 5px;border-radius:5px}
.chip.none{background:var(--line);color:var(--muted)}
.en{display:inline-block;width:30px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.en i{display:block;height:100%;border-radius:3px}
.pill{display:inline-block;font:700 10.5px var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.pill.nailed{background:var(--ok-soft);color:var(--ok)}
.pill.learning{background:var(--warn-soft);color:var(--star)}
.pill.totry{border:1px dashed var(--muted);color:var(--muted);padding:1px 6px}
.pill.gap{background:none;border:1px solid var(--danger);color:var(--danger);padding:1px 6px}

.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center}
.now .big{width:64px;height:64px;font-size:20px;border-radius:12px;grid-row:span 2}
.lbl{font:700 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.now .t{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5vw,28px);line-height:1.15;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.now .a{color:var(--muted);min-width:0}
.now .meta{grid-column:3;grid-row:1/span 2;text-align:right}
.now .bpm{font:700 26px var(--f-mono)}
.now .bpm small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.now .actions{grid-column:1/-1;display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.setcard{margin-top:12px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.setcard .main{flex:1;min-width:180px}
.setcard .ttl{font-weight:700;font-size:16px;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .note{font-size:13px;margin-top:3px;opacity:.85;font-style:italic;overflow-wrap:anywhere}
.row .side{display:flex;align-items:center;gap:8px;flex:none}
.row .bpmc{font:500 14px var(--f-mono);color:var(--muted);width:44px;text-align:right}
.row.wrap{flex-wrap:wrap}
.row.wrap .side{margin-left:auto}
.pair{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.pair .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pair .arr{color:var(--muted);flex:none}
.stars{color:var(--star);letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars .off{color:var(--line)}
.uses{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.hint{font:500 12px var(--f-mono);color:var(--muted)}
.hint .good{color:var(--ok)}
.hint .meh{color:var(--star)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ex{font:600 10px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat b{display:block;font:700 26px var(--f-mono);line-height:1.1}
.stat.nailed b{color:var(--ok)} .stat.learning b{color:var(--star)} .stat.totry b{color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;margin-top:12px}
.progress i{display:block;height:100%}

.setlist .row .ttl{font-size:16px}
.sethead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sethead .t{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.1;flex:1;min-width:200px;overflow-wrap:anywhere;text-wrap:balance}
.curve{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:14px}
.curve svg{display:block;width:100%;height:96px}
.curve .tl{fill:none;stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5;opacity:.7}
.curve .el{fill:none;stroke:var(--accent);stroke-width:2.5}
.curve .gl{stroke:var(--line);stroke-width:1}
.curve text{font:500 10px var(--f-mono);fill:var(--muted)}
.steps{display:flex;flex-direction:column;margin-top:14px}
.step{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.step .n{font:700 13px var(--f-mono);color:var(--muted);width:20px;text-align:right;flex:none}
.step .main{flex:1;min-width:0}
.step .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .sub{font-size:13px;color:var(--muted)}
.step .ctl{display:flex;gap:4px;flex:none}
.link{margin-left:30px;border-left:2px solid var(--line);padding:6px 0 6px 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link.nailed{border-color:var(--ok)} .link.learning{border-color:var(--star)} .link.totry{border-left-style:dashed} .link.gap{border-color:var(--danger);border-left-style:dotted}
.link .note{font-style:italic;color:var(--ink);opacity:.8;overflow-wrap:anywhere;min-width:0}
@media (max-width:520px){.step{flex-wrap:wrap}.step .ctl{width:100%;justify-content:flex-end}}

.graphbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#g{display:block;width:100%;height:clamp(420px,66vh,760px);touch-action:none;cursor:grab}
#g.dragging{cursor:grabbing}
#g text{font-family:var(--f-body);fill:var(--ink)}
#g .lab{font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
#g .ringlab{font:700 13px var(--f-mono);fill:var(--muted);opacity:.55;pointer-events:none}
#g .ring{fill:none;stroke:var(--ring);stroke-width:1}
#g .edge{fill:none;stroke:var(--edge)}
#g .edge.totry{stroke-dasharray:5 5}
#g .edge.nailed{stroke:var(--ok)}
#g .edge.hi{stroke:var(--accent)}
#g .edge.dim{opacity:.12}
#g .node circle{stroke:var(--surface);stroke-width:2;cursor:pointer}
#g .node.sel circle{stroke:var(--ink);stroke-width:3}
#g .node.dim{opacity:.25}
#arrow path{fill:var(--edge)} #arrowok path{fill:var(--ok)} #arrowhi path{fill:var(--accent)}
.gctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.gctl .btn{width:36px;padding:6px 0;text-align:center}
.gmode{position:absolute;left:10px;top:10px;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px}
.gmode button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.gmode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.legend{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;max-width:75%}
#gpanel{margin-top:14px}

.sheetbg{position:fixed;inset:0;background:rgb(10 12 20/.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.sheetbg{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:20px;margin:0 0 14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f label,.f .fl{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px 4px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.starin{display:flex;gap:2px;align-items:center}
.starin button{border:0;background:none;font-size:28px;line-height:1;padding:2px 3px;cursor:pointer;color:var(--line)}
.starin button.on{color:var(--star)}
.starin span{font-size:12px;color:var(--muted);margin-left:8px}
.formhint{padding:9px 11px;border-radius:8px;background:var(--bg);margin-bottom:12px;font-size:13px}
.err{color:var(--danger);font-size:13px;margin-bottom:10px}
.sheet .foot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sheet .foot .sp{margin-left:auto}
.sheet .list{max-height:52vh;overflow:auto;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<header class="top"><div class="wrap topin">
  <div class="brand"><i></i>Mixgraph</div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="next" aria-selected="true">Next</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button role="tab" data-tab="sets" aria-selected="false">Sets</button>
    <button role="tab" data-tab="graph" aria-selected="false">Graph</button>
    <button role="tab" data-tab="tracks" aria-selected="false">Tracks</button>
  </nav>
  <button class="btn primary" data-action="add-track">+ Track</button>
</div></header>
<div id="banner" class="wrap" hidden><div class="banner" id="bannertext"></div></div>

<main class="wrap">
  <section id="v-next">
    <div id="cur"></div>
    <div id="picker" hidden>
      <h2>Pick what's playing</h2>
      <div class="toolbar" style="margin-bottom:10px"><input id="pickq" class="search" type="search" placeholder="Search title, artist, key or BPM" autocomplete="off"></div>
      <div id="picklist"></div>
    </div>
    <div id="nextbody"></div>
  </section>

  <section id="v-practice" hidden></section>
  <section id="v-sets" hidden></section>

  <section id="v-graph" hidden>
    <div class="graphbox">
      <svg id="g" aria-label="Transition graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,5L0,10z"/></marker>
          <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,5L0,10z"/></marker>
          <marker id="arrowhi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,5L0,10z"/></marker>
        </defs>
        <g id="gworld"><g id="grings"></g><g id="gedges"></g><g id="gnodes"></g></g>
      </svg>
      <div class="gmode" role="group" aria-label="Color tracks by"><button data-action="gcolor" data-mode="key" aria-pressed="true">Key</button><button data-action="gcolor" data-mode="energy" aria-pressed="false">Energy</button></div>
      <div class="gctl"><button class="btn" data-action="zin" aria-label="Zoom in">+</button><button class="btn" data-action="zout" aria-label="Zoom out">−</button><button class="btn" data-action="fit" aria-label="Fit to screen">⤢</button></div>
      <div class="legend" id="glegend"></div>
    </div>
    <div id="gpanel"></div>
  </section>

  <section id="v-tracks" hidden>
    <div class="toolbar">
      <input id="trackq" class="search" type="search" placeholder="Search your tracks" autocomplete="off">
      <select id="tracksort" class="btn" aria-label="Sort tracks">
        <option value="title">A–Z</option><option value="bpm">BPM</option><option value="key">Key</option><option value="energy">Energy</option><option value="links">Most mixed</option>
      </select>
    </div>
    <h2>Library <span class="count" id="trackcount"></span><span class="sp"></span><button class="btn small ghost" data-action="clear-examples" id="clearex" hidden>Remove examples</button></h2>
    <div id="tracklist"></div>
  </section>
</main>

<div id="sheetbg" class="sheetbg" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
const CAM={'1A':'A♭m','1B':'B','2A':'E♭m','2B':'F♯','3A':'B♭m','3B':'D♭','4A':'Fm','4B':'A♭','5A':'Cm','5B':'E♭','6A':'Gm','6B':'B♭','7A':'Dm','7B':'F','8A':'Am','8B':'C','9A':'Em','9B':'G','10A':'Bm','10B':'D','11A':'F♯m','11B':'A','12A':'D♭m','12B':'E'};
const KEYS=[];for(let n=1;n<=12;n++)for(const l of'AB')KEYS.push(n+l);
const ENERGY_LBL={1:'chill',2:'chill',3:'chill',4:'groove',5:'groove',6:'groove',7:'high',8:'high',9:'peak',10:'peak'};
const STATUS_LBL={nailed:'Nailed',learning:'Learning',totry:'To try'};
const SHAPES={build:'Build up',arc:'Build, peak, cool down',steady:'Keep it steady'};
const ALLOW={nailed:'Only nailed transitions',practiced:'Nailed + learning',logged:'Anything I’ve logged',explore:'Also untried key matches'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function ago(t){if(!t)return'never';const d=(Date.now()-t)/864e5;if(d<1/24)return'just now';if(d<1)return Math.round(d*24)+'h ago';if(d<2)return'yesterday';return Math.round(d)+'d ago'}

/* ---------- music helpers ---------- */
function pk(k){const m=/^(\d{1,2})([AB])$/.exec(k||'');return m?{n:+m[1],l:m[2]}:null}
function keyColor(k){const p=pk(k);if(!p)return null;const h=((p.n-1)*30+150)%360;return p.l==='A'?`hsl(${h} 58% 42%)`:`hsl(${h} 66% 54%)`}
function energyColor(e){if(!e)return null;return`hsl(${220-(e-1)/9*215} 70% 50%)`}
function chip(k,cls=''){const c=keyColor(k);return c?`<span class="chip mono ${cls}" style="background:${c}" title="${esc(CAM[k])}">${esc(k)}</span>`:`<span class="chip none ${cls}">—</span>`}
const enBar=e=>e?`<span class="en" title="Energy ${e}/10"><i style="width:${e*10}%;background:${energyColor(e)}"></i></span>`:`<span class="en" title="No energy set"></span>`;
function keyRel(a,b){
  const A=pk(a),B=pk(b);if(!A||!B)return null;
  const d=((B.n-A.n)%12+12)%12;
  if(A.l===B.l){
    if(d===0)return{label:'same key',score:3};
    if(d===1)return{label:'+1',score:3};
    if(d===11)return{label:'−1',score:3};
    if(d===2)return{label:'+2 energy',score:1};
    if(d===7)return{label:'+1 semitone',score:1};
  }else if(d===0)return{label:A.l==='A'?'to major':'to minor',score:2};
  return{label:'clash',score:0};
}
function bpmRel(a,b){
  if(!a||!b)return null;
  const c=[b,b*2,b/2].reduce((x,y)=>Math.abs(y-a)<Math.abs(x-a)?y:x);
  return{pct:(c-a)/a*100,half:c!==b};
}
function compat(a,b){const k=keyRel(a.key,b.key),p=bpmRel(a.bpm,b.bpm);return{k,p,ok:!!(k&&k.score>=2&&p&&Math.abs(p.pct)<=6),score:(k?.score||0)*10-(p?Math.abs(p.pct):8)}}
function hint(a,b){
  const{k,p}=compat(a,b);const out=[];
  if(k)out.push(`<span class="${k.score>=2?'good':k.score===1?'meh':''}">${esc(a.key)}→${esc(b.key)} ${esc(k.label)}</span>`);
  if(p){const s=(p.pct>=0?'+':'')+p.pct.toFixed(1)+'%';out.push(`<span class="${Math.abs(p.pct)<=3?'good':Math.abs(p.pct)<=6?'meh':''}">${s}${p.half?' (half/double)':''}</span>`)}
  if(a.energy&&b.energy)out.push(`E${a.energy}→E${b.energy}`);
  return out.join(' · ')||'Add key and BPM for match hints';
}
const stars=r=>r?`<span class="stars" aria-label="${r} of 5">${'★'.repeat(r)}<span class="off">${'★'.repeat(5-r)}</span></span>`:'';

/* ---------- practice helpers ---------- */
function status(tr){return tr.status||((tr.rating||0)>0?'learning':'totry')}
const pill=st=>`<span class="pill ${st}">${STATUS_LBL[st]||'No link'}</span>`;
function recent(tr){const r=(tr.log||[]).slice(-5);return{ok:r.filter(x=>x.ok).length,n:r.length}}
function recentTxt(tr){const r=recent(tr);return r.n?`${r.ok}/${r.n} clean lately`:'not practiced yet'}
function priority(tr){
  const st=status(tr),r=recent(tr);const days=Math.min((Date.now()-(tr.lastPracticed||0))/864e5,14);
  const base=st==='learning'?3:st==='totry'?2.2:0;const miss=r.n?(1-r.ok/r.n)*2:0;
  return base+miss+days/5;
}

/* ---------- state + storage ---------- */
const S={tracks:new Map(),trans:new Map(),sets:new Map()};
let db=null,mode='loading',tab='next',cur=ls.get('mg.cur'),picking=false,activeSet=ls.get('mg.set')||null,openSet=null,pfilter='all';
const COL={tracks:'tracks',trans:'transitions',sets:'sets'};
function local(){try{return JSON.parse(ls.get('mg.local')||'{}')}catch{return{}}}
function persistLocal(){ls.set('mg.local',JSON.stringify({tracks:Object.fromEntries(S.tracks),trans:Object.fromEntries(S.trans),sets:Object.fromEntries(S.sets)}))}
async function save(kind,id,data){
  try{
    if(db)await db.collection(COL[kind]).doc(id).set(data);
    else{S[kind].set(id,data);persistLocal();renderAll()}
    return true;
  }catch(e){toast(errMsg(e));return false}
}
async function patch(kind,id,data){const old=S[kind].get(id);if(!old)return false;return save(kind,id,{...old,...data})}
async function remove(kind,id){
  try{
    if(db)await db.collection(COL[kind]).doc(id).delete();
    else{S[kind].delete(id);persistLocal();renderAll()}
    return true;
  }catch(e){toast(errMsg(e));return false}
}
function errMsg(e){
  if(e?.code==='quota_exceeded')return'Your library is full. Remove some tracks or transitions to add more.';
  if(e?.code==='invalid_argument')return'You can view this library but not change it.';
  return'Could not save. Check your connection and try again.';
}
function banner(t){$('#banner').hidden=!t;$('#bannertext').textContent=t||''}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- derived ---------- */
const tracksArr=()=>[...S.tracks.entries()].map(([id,t])=>({id,...t}));
const transArr=()=>[...S.trans.entries()].map(([id,t])=>({id,...t})).filter(t=>S.tracks.has(t.from)&&S.tracks.has(t.to));
const setsArr=()=>[...S.sets.entries()].map(([id,s])=>({id,...s})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const T=id=>{const t=S.tracks.get(id);return t?{id,...t}:null};
function findTrans(from,to){for(const[id,t]of S.trans)if(t.from===from&&t.to===to)return{id,...t};return null}
function degree(id){let o=0,i=0;for(const t of S.trans.values()){if(t.from===id)o++;if(t.to===id)i++}return{o,i}}
const stRank={nailed:3,learning:2,totry:1};
const byQuality=(a,b)=>stRank[status(b)]-stRank[status(a)]||(b.rating||0)-(a.rating||0)||(b.uses||0)-(a.uses||0);

/* ---------- tabs ---------- */
const TABS=['next','practice','sets','graph','tracks'];
function setTab(t){
  tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  for(const v of TABS)$('#v-'+v).hidden=v!==t;
  try{history.replaceState(null,'','#'+t)}catch{}
  renderAll();
  if(t==='graph'){sizeGraph();kick(.6)}
}
function setCur(id){cur=id;picking=false;ls.set('mg.cur',id||'');if(tab!=='next')setTab('next');else renderAll();scrollTo({top:0,behavior:'smooth'})}

function renderAll(){
  if(cur&&!S.tracks.has(cur)&&mode!=='loading')cur=null;
  if(activeSet&&!S.sets.has(activeSet)&&mode!=='loading')activeSet=null;
  $('#clearex').hidden=!tracksArr().some(t=>t.example);
  if(tab==='next')renderNext();
  if(tab==='practice')renderPractice();
  if(tab==='sets')renderSets();
  if(tab==='tracks')renderTracks();
  if(tab==='graph'){syncGraph();renderPanel()}
}

}
function setCard(c){
  const set=activeSet&&S.sets.get(activeSet);if(!set)return'';
  const ids=(set.trackIds||[]).filter(id=>S.tracks.has(id));const i=ids.indexOf(c.id);

  const tr=findTrans(c.id,nx.id);

    <div class="meta"><div class="bpm">${c.bpm||'—'}<small>BPM</small></div><div class="hint">${c.key?esc(CAM[c.key]):'no key'}${c.energy?' · E'+c.energy:''}</div></div>
    <div class="a">${esc(c.artist||'Unknown artist')}</div>
    <div class="actions"><button class="btn" data-action="pick">Change track</button><button class="btn primary" data-action="add-trans" data-from="${c.id}">+ Log a transition</button><button class="btn ghost" data-action="edit-track" data-id="${c.id}">Edit</button></div>
  </div>${setCard(c)}`;

  const tried=new Set(out.map(t=>t.to));
  const sugg=all.filter(t=>t.id!==c.id&&!tried.has(t.id)).map(t=>({t,m:compat(c,t)})).filter(x=>x.m.ok).sort((a,b)=>b.m.score-a.m.score).slice(0,8);
  let h=`<h2>Mix into <span class="count">${out.length}</span></h2>`;
  h+=out.length?`<div class="list">${out.map(tr=>{const to=T(tr.to);return`<div class="row wrap">${chip(to.key)}<div class="main"><div class="ttl">${esc(to.title)}</div><div class="sub">${pill(status(tr))} ${stars(tr.rating)} <span class="uses">· used ${tr.uses||0}×</span> <span class="hint">· ${hint(c,to)}</span></div>${tr.notes?`<div class="note">${esc(tr.notes)}</div>`:''}</div><div class="side"><button class="btn small ghost" data-action="edit-trans" data-id="${tr.id}">Edit</button><button class="btn small primary" data-action="mixed" data-id="${tr.id}">Mixed it →</button></div></div>`}).join('')}</div>`

    :`<div class="empty">${c.key&&c.bpm?'No untried tracks with a compatible key within 6% BPM.':'Add a key and BPM to this track to get suggestions.'}</div>`;
  if(inc.length){h+=`<h2>Comes in from <span class="count">${inc.length}</span></h2><div class="list">${inc.map(tr=>trackRow(T(tr.from),pill(status(tr)))).join('')}</div>`}

function filterTracks(q){q=q.trim().toLowerCase();const a=tracksArr();if(!q)return a;return a.filter(t=>[t.title,t.artist,t.key,t.key&&CAM[t.key],t.bpm].join(' ').toLowerCase().includes(q))}
function renderPick(){

function renderPractice(){
  const all=transArr();const el=$('#v-practice');
  if(!all.length){el.innerHTML=`<h2>Practice</h2><div class="empty">${mode==='loading'?'Loading…':'Log a few transitions first. On the Next tab, pick a track and tap “+ Want to try” on a suggestion, or “+ Log a transition”.'}</div>`;return}

    ${list.length?`<div class="list">${list.map(practiceRow).join('')}</div>`:`<div class="empty">Nothing here yet.</div>`}`;

async function practice(id,ok){
  const tr=S.trans.get(id);if(!tr)return;
  const before=status(tr);
  const log=[...(tr.log||[]),{t:Date.now(),ok}].slice(-20);
  const r=log.slice(-5),okc=r.filter(x=>x.ok).length;
  const st=r.length>=3&&okc/r.length>=.6&&okc>=3?'nailed':'learning';
  if(await patch('trans',id,{log,status:st,lastPracticed:Date.now()}))
    toast(st==='nailed'&&before!=='nailed'?'Nailed it! Marked as nailed.':st!=='nailed'&&before==='nailed'?`Back to learning · ${okc}/${r.length} clean`:`Logged · ${okc}/${r.length} clean lately`);
}

/* ---------- Sets ---------- */
function targetEnergy(shape,i,n,e0){
  const x=n>1?i/(n-1):0;
  if(shape==='build')return e0+(9-e0)*x;
  if(shape==='arc')return x<.7?e0+(9-e0)*(x/.7):9-3*((x-.7)/.3);
  return e0;
}
function buildSet({start,len,shape,allow}){
  const e0=T(start)?.energy||4;const tracks=tracksArr();const cache=new Map();
  const edges=id=>{
    if(cache.has(id))return cache.get(id);
    const out=[];
    for(const tr of transArr())if(tr.from===id){
      const st=status(tr);
      if(allow==='nailed'&&st!=='nailed')continue;
      if(allow==='practiced'&&st==='totry')continue;
      out.push({to:tr.to,q:(st==='nailed'?3:st==='learning'?2:1)+(tr.rating||2)*.4});
    }
    if(allow==='explore'){const a=T(id);for(const b of tracks)if(b.id!==id&&!out.some(o=>o.to===b.id)&&compat(a,b).ok)out.push({to:b.id,q:.6})}
    cache.set(id,out);return out;
  };
  let beam=[{path:[start],score:0}],best=beam[0];
  for(let i=1;i<len;i++){
    const next=[];
    for(const b of beam){
      for(const e of edges(b.path[b.path.length-1])){
        if(b.path.includes(e.to))continue;
        const en=S.tracks.get(e.to).energy;const fit=en?-Math.abs(en-targetEnergy(shape,i,len,e0))*.7:-1.5;
        next.push({path:[...b.path,e.to],score:b.score+e.q+fit});
      }
    }
    if(!next.length)break;
    next.sort((a,b)=>b.score-a.score);beam=next.slice(0,60);best=beam[0];
  }
  return best.path;
}
function setStats(ids){
  let nailed=0,gaps=0;
  for(let i=0;i<ids.length-1;i++){const tr=findTrans(ids[i],ids[i+1]);if(!tr)gaps++;else if(status(tr)==='nailed')nailed++}
  return{links:Math.max(ids.length-1,0),nailed,gaps};
}
const liveIds=s=>(s.trackIds||[]).filter(id=>S.tracks.has(id));
function readyPill(ids){const st=setStats(ids);if(!st.links)return'';return st.gaps?`<span class="pill gap">${st.gaps} gap${st.gaps>1?'s':''}</span>`:st.nailed===st.links?`<span class="pill nailed">Ready</span>`:`<span class="pill learning">${st.nailed}/${st.links} nailed</span>`}
function curveSvg(set,ids){
  const n=ids.length;if(n<2)return'';const W=300,H=96,px=i=>14+i/(n-1)*(W-24),py=e=>H-12-(e-1)/9*(H-24);
  const e0=T(ids[0])?.energy||4;const shape=set.params?.shape||'steady';
  let tl='',el='',dots='';
  for(let i=0;i<n;i++){tl+=`${i?'L':'M'}${px(i).toFixed(1)},${py(targetEnergy(shape,i,n,e0)).toFixed(1)}`;const e=T(ids[i]).energy;if(e){el+=`${el?'L':'M'}${px(i).toFixed(1)},${py(e).toFixed(1)}`;dots+=`<circle cx="${px(i).toFixed(1)}" cy="${py(e).toFixed(1)}" r="4" fill="${energyColor(e)}"/>`}}
  return`<div class="curve"><div class="lbl">Energy across the set <span style="text-transform:none;letter-spacing:0;font-weight:500">· dashed line is the shape you picked</span></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Energy curve">
    <line class="gl" x1="14" x2="${W-10}" y1="${py(1)}" y2="${py(1)}"/><line class="gl" x1="14" x2="${W-10}" y1="${py(10)}" y2="${py(10)}"/>
    <path class="tl" d="${tl}" vector-effect="non-scaling-stroke"/><path class="el" d="${el}" vector-effect="non-scaling-stroke"/>${dots}</svg></div>`;
}
function renderSets(){
  const el=$('#v-sets');const s=openSet&&S.sets.get(openSet);
  if(!s){
    openSet=null;const sets=setsArr();
    el.innerHTML=`<h2>Your sets <span class="count">${sets.length}</span><span class="sp"></span><button class="btn small primary" data-action="new-set">+ Build a set</button></h2>
      <p class="lead">Pick a starting track and a shape, and Mixgraph chains together transitions you’ve practiced. Rate each track’s energy (1–10) for a better shape.</p>
      ${sets.length?`<div class="list setlist">${sets.map(x=>{const ids=liveIds(x);const f=T(ids[0]);return`<div class="row tap" data-action="open-set" data-id="${x.id}"><div class="main"><div class="ttl">${esc(x.name)}${x.example?'<span class="ex">example</span>':''}</div><div class="sub">${ids.length} tracks${f?' · starts with '+esc(f.title):''}${x.params?' · '+esc(SHAPES[x.params.shape]||''):''}</div></div><div class="side">${readyPill(ids)}${activeSet===x.id?'<span class="pill learning">Playing</span>':''}</div></div>`}).join('')}</div>`
      :`<div class="empty">${mode==='loading'?'Loading…':S.tracks.size<3?'Add a few tracks and log transitions between them, then come back to build your first set.':'No sets yet. Tap “+ Build a set” to make your first one.'}</div>`}`;
    return;
  }
  const ids=liveIds(s);const st=setStats(ids);
  let steps='';
  ids.forEach((id,i)=>{
    const t=T(id);
    steps+=`<div class="step"><span class="n">${i+1}</span>${chip(t.key)}<div class="main"><div class="ttl">${esc(t.title)}</div><div class="sub">${esc(t.artist||'Unknown artist')} · <span class="mono">${t.bpm||'—'} BPM${t.energy?' · E'+t.energy:''}</span></div></div>
      <div class="ctl"><button class="btn icon" data-action="set-up" data-i="${i}" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn icon" data-action="set-down" data-i="${i}" ${i<ids.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="btn small" data-action="set-swap" data-i="${i}">Swap</button><button class="btn icon danger" data-action="set-rm" data-i="${i}" aria-label="Remove">✕</button></div></div>`;
    if(i<ids.length-1){
      const nx=T(ids[i+1]);const tr=findTrans(id,nx.id);
      steps+=tr?`<div class="link ${status(tr)}">${pill(status(tr))} ${stars(tr.rating)} <span class="uses">${recentTxt(tr)}</span>${tr.notes?`<span class="note">${esc(tr.notes)}</span>`:''}</div>`

/* ---------- Graph ---------- */
const svg=$('#g');
const G={nodes:new Map(),s:1,tx:0,ty:0,sel:null,alpha:0,raf:0,w:800,h:500,fitted:false,color:ls.get('mg.gcolor')==='energy'?'energy':'key'};
function legend(){$('#glegend').textContent=(G.color==='key'?'Tracks sit around the Camelot wheel by key and are colored by key.':'Colored by energy: blue is chill, red is peak. Grey means no energy set.')+' Green arrows are nailed, dashed ones are still to try.'}
function anchor(t){const p=pk(t.key);if(!p)return{x:0,y:0};const ang=((p.n-1)/12)*Math.PI*2-Math.PI/2;const r=p.l==='A'?210:320;return{x:Math.cos(ang)*r,y:Math.sin(ang)*r}}
function syncGraph(){
  for(const t of tracksArr()){
    let n=G.nodes.get(t.id);const an=anchor(t);
    if(!n){n={x:an.x+(Math.random()-.5)*60,y:an.y+(Math.random()-.5)*60,vx:0,vy:0};G.nodes.set(t.id,n);kick(1)}
    n.ax=an.x;n.ay=an.y;n.t=t;
  }
  for(const id of G.nodes.keys())if(!S.tracks.has(id)){G.nodes.delete(id);if(G.sel===id)G.sel=null}
  drawRings();kick(.3);
}
function drawRings(){
  let h=`<circle class="ring" r="210"/><circle class="ring" r="320"/>`;
  for(let n=1;n<=12;n++){const ang=((n-1)/12)*Math.PI*2-Math.PI/2;h+=`<text class="ringlab" text-anchor="middle" dominant-baseline="middle" x="${Math.cos(ang)*395}" y="${Math.sin(ang)*395}">${n}</text>`}
  $('#grings').innerHTML=h;
}
function tick(){
  const ns=[...G.nodes.values()];const a=G.alpha;
  for(const p of ns){p.fx=(p.ax-p.x)*.02;p.fy=(p.ay-p.y)*.02}
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const p=ns[i],q=ns[j];let dx=p.x-q.x,dy=p.y-q.y;let d2=dx*dx+dy*dy;if(d2<1){dx=Math.random();dy=Math.random();d2=1}
    if(d2>90000)continue;const d=Math.sqrt(d2);const f=1600/d2;p.fx+=dx/d*f;p.fy+=dy/d*f;q.fx-=dx/d*f;q.fy-=dy/d*f;
  }
  for(const t of S.trans.values()){const p=G.nodes.get(t.from),q=G.nodes.get(t.to);if(!p||!q)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-120)*.006;p.fx+=dx/d*f;p.fy+=dy/d*f;q.fx-=dx/d*f;q.fy-=dy/d*f}
  for(const p of ns){if(p.fixed){p.vx=p.vy=0;continue}p.vx=(p.vx+p.fx*a)*.6;p.vy=(p.vy+p.fy*a)*.6;p.x+=p.vx;p.y+=p.vy}
}
function kick(a){if(tab!=='graph')return;G.alpha=Math.max(G.alpha,a);if(!G.raf)G.raf=requestAnimationFrame(loop)}
function loop(){tick();G.alpha*=.97;draw();if(G.alpha>.01&&tab==='graph')G.raf=requestAnimationFrame(loop);else{G.raf=0;if(!G.fitted&&G.nodes.size){G.fitted=true;fit()}}}
const rad=id=>{const d=degree(id);return 8+Math.min(d.o+d.i,8)*1.2};
function draw(){
  $('#gworld').setAttribute('transform',`translate(${G.tx},${G.ty}) scale(${G.s})`);
  const sel=G.sel,nb=new Set();
  const tr=transArr();
  if(sel)for(const t of tr){if(t.from===sel)nb.add(t.to);if(t.to===sel)nb.add(t.from)}
  let eh='';
  for(const t of tr){const p=G.nodes.get(t.from),q=G.nodes.get(t.to);if(!p||!q)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;const ux=dx/d,uy=dy/d;
    const r1=rad(t.from)+2,r2=rad(t.to)+4;const x1=p.x+ux*r1,y1=p.y+uy*r1,x2=q.x-ux*r2,y2=q.y-uy*r2;
    const off=Math.min(d*.12,30);const cx=(x1+x2)/2-uy*off,cy=(y1+y2)/2+ux*off;
    const st=status(t),hi=sel&&t.from===sel,dim=sel&&!(t.from===sel||t.to===sel);
    eh+=`<path class="edge ${st}${hi?' hi':''}${dim?' dim':''}" stroke-width="${(1+(t.rating||1)*.7)/G.s**.3}" marker-end="url(#${hi?'arrowhi':st==='nailed'?'arrowok':'arrow'})" d="M${x1.toFixed(1)},${y1.toFixed(1)}Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>`}
  $('#gedges').innerHTML=eh;
  const many=G.nodes.size>50&&G.s<.9;let nh='';
  for(const[id,n]of G.nodes){
    const r=rad(id),isSel=id===sel,dim=sel&&!isSel&&!nb.has(id);
    const lab=!many||isSel||nb.has(id);const title=n.t.title.length>22?n.t.title.slice(0,21)+'…':n.t.title;
    const fill=(G.color==='energy'?energyColor(n.t.energy):keyColor(n.t.key))||'var(--muted)';
    nh+=`<g class="node${isSel?' sel':''}${dim?' dim':''}" data-node="${id}"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${fill}"/>${lab?`<text class="lab" text-anchor="middle" x="${n.x.toFixed(1)}" y="${(n.y+r+13).toFixed(1)}" font-size="${11/Math.max(G.s,.6)}">${esc(title)}</text>`:''}</g>`}
  $('#gnodes').innerHTML=nh;
}
function sizeGraph(){const r=svg.getBoundingClientRect();if(!r.width)return;if(!G.w0){G.tx=r.width/2;G.ty=r.height/2}G.w0=1;G.w=r.width;G.h=r.height}
function fit(){
  sizeGraph();const ns=[...G.nodes.values()];
  let x0=-400,x1=400,y0=-400,y1=400;
  for(const n of ns){x0=Math.min(x0,n.x-40);x1=Math.max(x1,n.x+40);y0=Math.min(y0,n.y-40);y1=Math.max(y1,n.y+40)}
  G.s=Math.min(G.w/(x1-x0),G.h/(y1-y0))*.95;G.tx=G.w/2-(x0+x1)/2*G.s;G.ty=G.h/2-(y0+y1)/2*G.s;draw();
}
function zoom(f,mx=G.w/2,my=G.h/2){const s=Math.min(4,Math.max(.15,G.s*f));const wx=(mx-G.tx)/G.s,wy=(my-G.ty)/G.s;G.s=s;G.tx=mx-wx*s;G.ty=my-wy*s;draw()}
const ptrs=new Map();let P=null,pinch=null;
function local2(e){const r=svg.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,local2(e));
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:G.s};if(P?.id){const n=G.nodes.get(P.id);if(n)n.fixed=false}P=null;return}
  const el=e.target.closest('[data-node]');const m=local2(e);
  P={id:el?.dataset.node,sx:m.x,sy:m.y,tx:G.tx,ty:G.ty,moved:false};
  if(P.id){const n=G.nodes.get(P.id);if(n)n.fixed=true}
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,local2(e));
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoom(pinch.s*d/pinch.d/G.s,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(!P)return;const m=local2(e);const dx=m.x-P.sx,dy=m.y-P.sy;if(Math.abs(dx)+Math.abs(dy)>5)P.moved=true;
  if(P.id){const n=G.nodes.get(P.id);if(n&&P.moved){n.x=(m.x-G.tx)/G.s;n.y=(m.y-G.ty)/G.s;kick(.25);draw()}}
  else if(P.moved){G.tx=P.tx+dx;G.ty=P.ty+dy;draw()}
});
function endPtr(e){
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  svg.classList.remove('dragging');if(!P)return;
  if(P.id){const n=G.nodes.get(P.id);if(n)n.fixed=false;if(!P.moved){G.sel=G.sel===P.id?null:P.id;renderPanel();draw()}}
  else if(!P.moved&&G.sel){G.sel=null;renderPanel();draw()}
  P=null;
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const m=local2(e);zoom(Math.exp(-e.deltaY*.0015),m.x,m.y)},{passive:false});
addEventListener('resize',()=>{if(tab==='graph'){sizeGraph();draw()}});
function renderPanel(){
  const t=T(G.sel);
  if(!t){$('#gpanel').innerHTML=S.tracks.size?`<div class="hint" style="padding:4px 2px">${S.tracks.size} tracks · ${transArr().length} transitions. Drag to pan, scroll or pinch to zoom, drag a track to move it.</div>`:`<div class="empty">Add tracks and transitions to grow your map.</div>`;return}
  const out=transArr().filter(x=>x.from===t.id).sort(byQuality);
  $('#gpanel').innerHTML=`<div class="list">${trackRow(t,'<span class="btn small primary">Play from here</span>')}${out.map(tr=>{const to=T(tr.to);return`<div class="row tap" data-action="gsel" data-id="${to.id}"><span style="color:var(--muted)">→</span>${chip(to.key)}<div class="main"><div class="ttl">${esc(to.title)}</div>${tr.notes?`<div class="sub">${esc(tr.notes)}</div>`:''}</div><div class="side">${pill(status(tr))}</div></div>`}).join('')||`<div class="row"><div class="main sub">No transitions out of this track yet.</div></div>`}</div>`;
}

/* ---------- boot ---------- */
(async function boot(){
  document.querySelectorAll('.gmode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===G.color));legend();
  const h=(location.hash||'').slice(1);
  setTab(TABS.includes(h)?h:'next');
  db=await (window.claude?.use?.('db')??Promise.resolve(null)).catch(()=>null);
  if(!db){
    mode='local';const l=local();
    for(const kind of['tracks','trans','sets'])for(const[k,v]of Object.entries(l[kind]||{}))S[kind].set(k,v);
    banner('Your library is saved in this browser only. Clearing your browser data will erase it.');
    renderAll();return;
  }
  const got={tracks:false,trans:false,sets:false};const done=()=>got.tracks&&got.trans&&got.sets;
  const timer=setTimeout(()=>{if(!done())banner('Can’t reach your saved library yet. What you see may be out of date; changes will sync once it connects.')},10000);
  for(const kind of['tracks','trans','sets']){
    db.collection(COL[kind]).onSnapshot(snap=>{
      S[kind]=new Map(snap.docs.map(d=>[d.id,d.data()]));
      if(!snap.metadata.fromCache){got[kind]=true;if(done()){clearTimeout(timer);mode='db';banner('')}}
      renderAll();
    },err=>{clearTimeout(timer);mode='db';banner(err.code==='revoked'?'':'Your library stopped syncing. Reload the page to reconnect.');renderAll()});
  }
})();
</script>
